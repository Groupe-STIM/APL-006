<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ma journée numérique, mes choix</title><style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f5f5f5;color:#222;margin:0}main{max-width:820px;margin:20px auto;background:white;border:1px solid #ddd;border-radius:16px;padding:24px}h1,h2,p{margin:0 0 12px}h1{text-align:center;font-size:26px}h2{font-size:19px}.center{text-align:center}.muted,small{color:#666}.section{border-top:1px solid #ddd;padding:18px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.big{font-size:28px;font-weight:700}.bar{height:24px;background:#d9d9d9;border-radius:5px;display:flex;position:relative;overflow:visible;margin:12px 0 8px}.seg{height:100%}.marker{position:absolute;top:-4px;bottom:-4px;width:3px;background:white;box-shadow:0 0 0 1px #777}.target{position:absolute;bottom:30px;transform:translateX(-50%);font-size:12px;white-space:nowrap}.withtarget{margin-top:30px}.fill{background:#555;height:100%;border-radius:5px;display:flex;align-items:center;justify-content:center;color:white;font-weight:600}.activity{display:grid;grid-template-columns:5px 1fr 32px 58px 32px 78px;gap:8px;align-items:center;margin:9px 0}.stripe{height:38px;border-radius:3px}.amount,.energy{text-align:right;font-variant-numeric:tabular-nums}.amount{text-align:center}button,select{font:inherit;border:1px solid #ccc;border-radius:8px;background:white;padding:7px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.wide{display:block;width:100%;margin:10px 0;padding:12px}.primary{background:#222;color:white;border-color:#222}.panel{border:1px solid #ddd;border-radius:12px;padding:18px;margin-top:12px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;margin:20px 0}.bad{color:#b42318}.good{color:#16734a}.compare{display:grid;grid-template-columns:1fr 100px;align-items:center;gap:10px}.compare .bar{margin:3px 0}.ghost{border:0}.pct{position:absolute;top:2px;font-weight:600;color:#555}@media(max-width:520px){main{padding:12px;margin:0}.activity{grid-template-columns:4px 1fr 28px 45px 28px 58px;gap:4px;font-size:13px}.big{font-size:23px}}
</style><main id="app"></main><script>
const acts=[['YouTube',15,240,.35,1,'#468BB8','▶'],['Roblox',15,240,7/60,1,'#8473BD','🎮'],['TikTok',15,240,.35,1,'#D59A42','▣'],['WhatsApp — appel audio',15,180,4/60,1,'#429D80','☎'],['WhatsApp — appel vidéo',15,180,.5,1,'#78B3A7','▣'],['Netflix',30,240,21/60,1,'#C46D70','▤'],["Poser des questions simples à l’IA",1,60,.34,1,'#A6AD56','◇'],["Générer des textes d’une page",1,15,2.4,10,'#C3A16D','▤'],['Générer des images',1,15,4,10,'#B47DAA','▧'],['Générer des vidéos de 3 secondes',1,10,260,20,'#C95743','▣']];
const sources=[['Hydroélectricité',24],['Solaire',48],['Éolien',11],['Nucléaire',12],['Gaz naturel',490],['Charbon',820]];let vals=[30,60,30,30,15,120,5,1,1,0],source=24,limit=Infinity,initial=null,confirm=false,finished=false;
const f=n=>n.toLocaleString('fr-CA',{maximumFractionDigits:1}),fg=n=>n.toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:2}),time=n=>`${Math.floor(n/60)} h ${String(n%60).padStart(2,'0')} min`;const totals=()=>{let e=acts.reduce((s,a,i)=>s+a[3]*vals[i],0),t=acts.reduce((s,a,i)=>s+a[4]*vals[i],0);return {e,t,g:e*source/1000}};
function change(i,d){vals[i]=Math.max(0,Math.min(acts[i][2],vals[i]+d*acts[i][1]));finished=false;render()}
function reset(){vals=initial?[...initial.vals]:acts.map(()=>0);confirm=finished=false;render()}
function start(){let x=totals();if(!x.e||x.t>780)return;initial={...x,vals:[...vals]};confirm=finished=false;render()}
function free(){vals=[...initial.vals];initial=null;limit=Infinity;finished=false;render()}
function render(){const {e,t,g}=totals(),b=initial?initial.e/2:limit,unlimited=!initial&&!isFinite(limit),scale=Math.max(e,initial?initial.e:unlimited?0:b,1e-9),over=e>b,pct=Math.round(t/780*100),w=Math.min(100,t/780*100);const marker=(label)=>initial?`<span class="marker" style="left:${100*b/scale}%"></span><span class="target" style="left:${Math.max(13,100*b/scale)}%">Objectif : ${label}</span>`:'';
const energybar=`<div class="bar ${initial?'withtarget':''}">${acts.map((a,i)=>`<div class="seg" style="background:${a[5]};width:${100*a[3]*vals[i]/scale}%"></div>`).join('')}${marker(f(b)+' Wh')}</div>`;
const rows=(start,end)=>acts.slice(start,end).map((a,k)=>{let i=k+start;return `<div class="activity"><span class="stripe" style="background:${a[5]}"></span><span>${a[6]} ${a[0]}${i>=6?`<br><small>${a[4]} min/unité · Total : ${a[4]*vals[i]} min</small>`:''}</span><button aria-label="Diminuer ${a[0]}" onclick="change(${i},-1)" ${!vals[i]?'disabled':''}>−</button><span class="amount">${vals[i]}${i<6?' min':''}</span><button aria-label="Augmenter ${a[0]}" onclick="change(${i},1)" ${vals[i]>=a[2]?'disabled':''}>+</button><span class="energy">${f(vals[i]*a[3])} Wh</span></div>`}).join('');
const comparison=finished&&initial?`<div class="section"><h2 class="center">Mon bilan numérique</h2><p class="center muted">Gris clair : Avant · Gris foncé : Après</p>${[['Consommation énergétique',initial.e,e,'Wh'],['Émissions de GES',initial.g,g,'g CO₂e'],['Temps connecté',initial.t,t,'min']].map(([n,a,c,u])=>`<p class="row"><b>${n}</b><span>${a?f((c/a-1)*100)+' %':'—'}</span></p>${[a,c].map((v,i)=>`<div class="compare"><div class="bar" style="background:transparent"><div class="fill" style="width:${100*v/Math.max(a,c,1e-9)}%;background:${i?'#555':'#a5a5a5'}"></div></div><span>${f(v)} ${u}</span></div>`).join('')}`).join('')}<h2 class="center good">🏆 Défi réussi!</h2></div>`:'';
app.innerHTML=`<h1>Ma journée numérique, mes choix</h1><p class="center muted">${initial?'Réduis de moitié la consommation énergétique de ta journée.':"Compose ta journée et observe l’impact de tes choix."}</p>${initial?'<p class="center"><b>◎ Défi des 50 %</b></p>':''}<div class="section"><div class="row"><div><b>⚡ Consommation énergétique</b><div class="big ${over?'bad':''}">${f(e)} Wh</div></div><div class="center"><b>🚲 ${Math.round(e)} min</b><br><small>Équivalent en vélo</small></div></div>${energybar}<div class="row"><small class="${over?'bad':''}">${unlimited?'Aucune limite énergétique':over?'Budget dépassé de '+f(e-b)+' Wh':'Budget restant : '+f(b-e)+' Wh'}</small>${initial?`<small>Budget : ${f(b)} Wh</small>`:`<select aria-label="Budget" onchange="limit=Number(this.value);render()">${[Infinity,100,150,200,300,500].map(v=>`<option value="${v}" ${v===limit?'selected':''}>Budget : ${isFinite(v)?v+' Wh':'Illimité'}</option>`).join('')}</select>`}</div>${initial?`<div class="row"><small>Consommation initiale : ${f(initial.e)} Wh</small><small>${e<=initial.e?'Réduction':'Augmentation'} : ${f(Math.abs(1-e/initial.e)*100)} %</small></div>`:''}</div><div class="section"><div class="row"><div><b>☁ Émissions de GES</b><div class="big">${f(g)} g CO₂e</div></div><div><small>Source d’électricité ${initial?'🔒':''}</small><br><select aria-label="Source d’électricité" ${initial?'disabled':''} onchange="source=Number(this.value);render()">${sources.map(([n,v])=>`<option value="${v}" ${v===source?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="bar ${initial?'withtarget':''}"><div class="fill" style="width:${100*e/scale}%"></div>${marker(f(b*source/1000)+' g CO₂e')}</div><div class="row"><small>0 g CO₂e</small><small>${f((unlimited?e:scale)*source/1000)} g CO₂e</small></div></div><div class="section"><b>◷ Temps connecté</b><div class="big ${t>780?'bad':''}">${time(t)}</div><div class="bar"><div class="fill" style="width:${w}%">${w>=7?pct+' %':''}</div>${w<7?`<span class="pct" style="left:calc(${w}% + 5px)">${pct} %</span>`:''}</div>${t>780?`<p class="bad">Tu dépasses la durée disponible de ${t-780} minutes.</p>`:''}</div><div class="section"><div class="row"><h2>Mes activités numériques</h2><small>⌁ À la maison</small></div><div class="row muted"><small>Activité</small><small>Durée · Énergie</small></div>${rows(0,6)}</div><div class="section"><h2>Mes activités avec l’IA</h2><div class="row muted"><small>Activité</small><small>Quantité · Énergie</small></div>${rows(6,10)}</div><div class="section">${!unlimited?over?`<p class="bad">${initial?'Il te reste '+f(e-b)+' Wh à économiser.':'Ton budget énergétique est dépassé.'}</p>`:t<=780?`<p class="good">${initial?'Bravo! Tu as réduit ta consommation d’au moins 50 %.':'Tu respectes ton budget énergétique!'}</p>`:'':''}<button class="wide" onclick="reset()">↶ ${initial?'Restaurer ma journée initiale':'Réinitialiser ma journée'}</button>${initial?`<button class="wide primary" ${over||t>780?'disabled':''} onclick="finished=true;render()">⚑ Terminer le défi</button><button class="wide ghost" onclick="free()">Revenir au mode libre</button>`:`<button class="wide primary" ${!e||t>780?'disabled':''} onclick="confirm=!confirm;render()">◎ Relever le défi des 50 %</button>${confirm?`<div class="panel"><h2 class="center">◎ Le défi des 50 %</h2><p>Serais-tu capable de passer une journée tout aussi agréable en consommant deux fois moins d’énergie?</p><div class="columns"><div><small>Ta consommation actuelle</small><div class="big">${f(e)} Wh</div><span class="muted">${fg(g)} g CO₂e</span></div><div><small>Ton nouveau budget</small><div class="big">${f(e/2)} Wh</div><span class="muted">${fg(g/2)} g CO₂e</span></div></div><p>Modifie tes activités et leur durée pour atteindre ton nouvel objectif.</p><button class="wide primary" ${!e||t>780?'disabled':''} onclick="start()">Je relève le défi!</button><button class="wide ghost" onclick="confirm=false;render()">Continuer à composer ma journée</button></div>`:''}`}${comparison}</div>`}render();
</script></html>
